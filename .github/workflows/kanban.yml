name: kanban
# Manual backstop only. Day to day, the local git hooks (pre-commit / pre-push) and the
# Claude Code hooks keep the boards valid and current, so this costs no CI minutes.
# Run it from the Actions tab if you ever edit tracking files outside a hooked clone (e.g. the GitHub web editor).
on:
  workflow_dispatch:
jobs:
  kanban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracking items
        run: python3 tools/kanban/kanban.py validate
      - name: Unit tests for the kanban tool
        run: python3 -m unittest discover -s tools/kanban/tests -v
      - name: Generated boards are up to date
        run: python3 tools/kanban/kanban.py build --check
