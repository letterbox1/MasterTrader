<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PROJECT__ · Kanban · CeraNova PM</title>
__FAVICON__
<meta name="description" content="Unified project kanban for __PROJECT__: per-phase boards, progress bars, bugs and doc-sync queue. Generated by ./kanban build.">
<style>
/*__FONTS__*/
/* CeraNova PM board theme, from the CeraNova OS design system: tonal surfaces, red + gold accents, Bebas Neue / DM Sans /
   Space Mono, 8px grid, 80px background grid, radial glows. Status colours stay functional so progress reads the same
   in every project. Light mode: #F7F5F2 base, #18171A text, same accents. */
:root{
  --red:#C41E3A;--red-light:#D42B48;--red-dark:#A01830;--gold:#C9A227;--gold-light:#D4AF37;--gold-dark:#8B6914;
  --bg:#F7F5F2;--col:#EFEBE5;--panel:#FFFFFF;--panel2:#F3F0EB;--elev:#FFFFFF;
  --line:rgba(24,23,26,.08);--line2:rgba(24,23,26,.14);--text:#18171A;--muted:#5C5B60;--faint:#8E8D92;
  --accent:var(--red);--brand:var(--red);--link:var(--gold-dark);--ring:rgba(196,30,58,.35);
  --done:#00716E;--review:#3E6FD8;--prog:#B18C09;--flare:var(--red);--violet:#6E4FE0;--teal:#00716E;
  --shadow:0 12px 32px rgba(0,0,0,.08);--glow-red:0 0 40px rgba(196,30,58,.12);--glow-gold:0 0 30px rgba(201,162,39,.12);
  --grid:rgba(24,23,26,.035);--glass:rgba(247,245,242,.72);
  --ease:cubic-bezier(.4,0,.2,1);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0E10;--col:#121315;--panel:#1A1B1F;--panel2:#141518;--elev:#202228;
  --line:rgba(240,237,232,.06);--line2:rgba(240,237,232,.12);--text:#F0EDE8;--muted:#9B9A9E;--faint:#5E5D63;
  --link:var(--gold-light);--ring:rgba(212,43,72,.45);
  --done:#80D5D1;--review:#7FA6FF;--prog:#ECC246;--violet:#B4A0FF;--teal:#80D5D1;
  --shadow:0 16px 40px rgba(0,0,0,.35);--glow-red:0 0 40px rgba(196,30,58,.18);--glow-gold:0 0 30px rgba(201,162,39,.15);
  --grid:rgba(240,237,232,.03);--glass:rgba(13,14,16,.72);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D0E10;--col:#121315;--panel:#1A1B1F;--panel2:#141518;--elev:#202228;
  --line:rgba(240,237,232,.06);--line2:rgba(240,237,232,.12);--text:#F0EDE8;--muted:#9B9A9E;--faint:#5E5D63;
  --link:var(--gold-light);--ring:rgba(212,43,72,.45);
  --done:#80D5D1;--review:#7FA6FF;--prog:#ECC246;--violet:#B4A0FF;--teal:#80D5D1;
  --shadow:0 16px 40px rgba(0,0,0,.35);--glow-red:0 0 40px rgba(196,30,58,.18);--glow-gold:0 0 30px rgba(201,162,39,.15);
  --grid:rgba(240,237,232,.03);--glass:rgba(13,14,16,.72);color-scheme:dark;}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:400 14px/1.6 "DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 0% -10%,rgba(196,30,58,.10),transparent 60%),radial-gradient(800px 380px at 100% -10%,rgba(201,162,39,.08),transparent 60%),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,80px 80px,80px 80px;background-attachment:fixed}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
.cap{font-family:"Space Mono",ui-monospace,monospace;font-size:11px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:"Bebas Neue","DM Sans",sans-serif;font-weight:400;letter-spacing:.04em;line-height:1;font-variant-numeric:tabular-nums}
.wrap{max-width:1728px;margin:0 auto;padding:0 32px 32px}
header{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;
  margin:0 -32px 24px;padding:16px 32px;background:var(--glass);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--red),var(--gold),transparent 70%);opacity:.6}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.mark{width:40px;height:40px;flex:none;object-fit:contain;filter:drop-shadow(0 0 12px rgba(196,30,58,.25))}
.markdot{width:16px;height:16px;border-radius:99px;flex:none;background:linear-gradient(135deg,var(--red),var(--gold))}
.titles{min-width:0}
.titles .cap{display:flex;gap:8px;align-items:center}.titles .cap b{color:var(--text);font-weight:400}
.titles .cap .sep{width:4px;height:4px;border-radius:99px;background:var(--faint)}
h1{font:500 20px/1.3 "DM Sans",sans-serif;letter-spacing:-.01em;margin:2px 0 0;display:flex;gap:8px;align-items:center;min-width:0}
h1 .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plogo{width:22px;height:22px;object-fit:contain;border-radius:4px;flex:none}
.plogo.txt{display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font:400 15px/1 "Bebas Neue",sans-serif;color:var(--muted)}
.sub{color:var(--muted);font-size:12px}
.overall{flex:1 1 360px;min-width:0;display:flex;gap:16px;align-items:center}
.overall .big{font-size:44px;background:linear-gradient(135deg,var(--red-light),var(--gold-light));-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.overall .rest{flex:1;min-width:0}
.bar{display:flex;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;transition:width .6s var(--ease)}.bar .d{background:var(--done)}.bar .r{background:var(--review)}.bar .p{background:var(--prog)}
.bar.big{height:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px}.dot.d{background:var(--done)}.dot.r{background:var(--review)}.dot.p{background:var(--prog)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:100px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
a.chip:hover{text-decoration:none;border-color:var(--line2);color:var(--text)}
.btn{background:transparent;border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:8px 16px;cursor:pointer;font:500 13px/1.2 "DM Sans",sans-serif;transition:all .2s var(--ease)}
.btn:hover{border-color:var(--red);box-shadow:var(--glow-red)}
.btn.primary{background:linear-gradient(135deg,var(--red),var(--red-dark));border-color:transparent;color:#fff}
.phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:16px;margin-bottom:24px}
.pcard{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;box-shadow:var(--shadow);text-align:left;color:inherit;font:inherit;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .2s var(--ease)}
.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold));opacity:0;transition:opacity .2s var(--ease)}
.pcard:hover{transform:translateY(-4px);border-color:var(--line2)}.pcard:hover::before,.pcard.on::before{opacity:1}
.pcard.on{border-color:var(--line2);box-shadow:var(--shadow),var(--glow-red)}
.pcard .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pcard .n{font-size:13px}.pcard .pct{font-size:30px}
.pcard .nm{font-size:13px;color:var(--muted);min-height:2.9em;margin:4px 0 12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.45}
.pcard .meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}.pcard .meta>span:first-child{white-space:nowrap}
.st{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:2px 8px;border-radius:100px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.st.in_progress{color:var(--prog);border-color:currentColor}.st.done{color:var(--done);border-color:currentColor}.st.locked{color:var(--faint)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.toolbar input[type=search],.toolbar select{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.toolbar input[type=search]{flex:1 1 240px;min-width:160px}
.toolbar select{border-radius:100px;padding:7px 12px}
.toolbar input[type=search]:focus,.toolbar select:focus{outline:none;border-color:var(--red);box-shadow:inset 0 0 0 1px var(--ring),var(--glow-red)}
.toolbar label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.toolbar input[type=checkbox]{accent-color:var(--red);width:16px;height:16px;border-radius:4px}
.phasehead{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.phasehead h2{margin:0;font:500 20px/1.3 "DM Sans",sans-serif;letter-spacing:-.01em}
.board{display:grid;grid-template-columns:repeat(6,minmax(176px,1fr));gap:16px;align-items:start}
.col{background:var(--col);border:1px solid var(--line);border-radius:16px;min-height:96px;display:flex;flex-direction:column;max-height:78vh}
.col h3{margin:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--col);border-radius:16px 16px 0 0}
.col h3 .cap{color:var(--text)}.col h3 .c{font-size:20px;color:var(--muted)}
.col.in_progress h3 .cap::before{content:"";display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--prog);margin-right:8px;vertical-align:1px;animation:pulse 1.6s var(--ease) infinite}
.col .list{padding:8px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;transition:transform .35s var(--ease),border-color .2s var(--ease),box-shadow .35s var(--ease)}
.card::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow)}
.card .id{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.card .ttl{margin:4px 0 8px;font-weight:500;font-size:13.5px;line-height:1.45}
.card .bd{display:flex;flex-wrap:wrap;gap:4px}
.b{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:0 8px;border-radius:100px;border:1px solid var(--line2);color:var(--muted);line-height:18px;white-space:nowrap}
.b.USER{color:var(--violet);border-color:currentColor}.b.BUILD{color:var(--review);border-color:currentColor}.b.OPS{color:var(--prog);border-color:currentColor}
.b.VERIFY{color:var(--done);border-color:currentColor}.b.RUN{color:var(--text)}.b.DOC{color:var(--muted)}.b.RESEARCH{color:var(--gold-light);border-color:currentColor}
.b.critical,.b.S1{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;border-color:transparent}.b.high,.b.S2{color:var(--red-light);border-color:currentColor}
.card.critical::before{background:var(--red)}.card.high::before{background:var(--gold)}.card.bug{border-style:dashed}
.mini{height:4px;border-radius:99px;background:var(--panel2);margin-top:8px;overflow:hidden}.mini i{display:block;height:100%;background:var(--prog)}
.warn{color:var(--red-light);font-size:12px;margin-top:4px}
.note{color:var(--muted);font-size:12px;margin-top:4px}
.empty{color:var(--faint);font-size:12px;padding:8px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px;margin-top:24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.panel h3{margin:0 0 8px}
.panel ul{margin:0;padding-left:18px}.panel li{margin:4px 0}
details.panel summary{cursor:pointer;font-weight:500}
.drawer{position:fixed;inset:0;display:none;z-index:20}
.drawer.on{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.drawer .sheet{position:absolute;top:0;right:0;height:100%;width:min(780px,100%);background:var(--elev);border-left:1px solid var(--line2);overflow:auto;padding:16px 24px;box-shadow:var(--shadow)}
.sheet .top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;position:sticky;top:-16px;background:var(--elev);padding:8px 0 12px;border-bottom:1px solid var(--line)}
.sheet h2{margin:4px 0 0;font:500 20px/1.3 "DM Sans",sans-serif;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13px;margin:16px 0}
.kv dt{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-top:2px}.kv dd{margin:0;word-break:break-word}
.md{font-size:14px;line-height:1.7}
.md h1{font-size:18px}.md h2{font:500 16px/1.3 "DM Sans",sans-serif;margin:24px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}.md h3{font-size:14px;margin:16px 0 4px}
.md ul,.md ol{padding-left:20px}.md li{margin:2px 0}
.md table{border-collapse:collapse;width:100%;font-size:12.5px;display:block;overflow:auto}.md td,.md th{border:1px solid var(--line2);padding:4px 8px;text-align:left}
.md pre{background:var(--panel2);padding:12px;border-radius:10px;overflow:auto}
.md .cb{list-style:none;margin-left:-18px}
footer{color:var(--muted);font-size:12px;margin:32px 0 8px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.credit{display:inline-flex;gap:8px;align-items:center;padding:4px 12px 4px 6px;border-radius:100px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12px;transition:all .2s var(--ease)}
.credit b{color:var(--text);font-weight:500}.credit:hover{text-decoration:none;color:var(--text);border-color:var(--line2);box-shadow:var(--glow-gold)}
.kitmark{height:20px;width:20px;object-fit:contain}
.kitdot{width:10px;height:10px;border-radius:99px;background:linear-gradient(135deg,var(--red),var(--gold))}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.phases,.board,.panels{animation:rise .6s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media (max-width:1100px){.board{grid-template-columns:repeat(6,minmax(240px,82vw));overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.col{scroll-snap-align:start}}
@media (max-width:960px){.wrap{padding:0 24px 24px}header{margin:0 -24px 16px;padding:12px 24px}.overall .big{font-size:36px}}
@media (max-width:640px){#theme{position:absolute;top:12px;right:16px;padding:6px 12px}.brand{padding-right:96px}.phases{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;gap:8px}.pcard{flex:0 0 min(176px,70vw);scroll-snap-align:start}.pcard:hover{transform:none}.pcard .nm{min-height:0}.overall{flex-basis:100%}header{position:relative}}
@media (max-width:480px){.titles .cap .sep,.titles .cap span:last-child{display:none}.wrap{padding:0 16px 16px}header{margin:0 -16px 16px;padding:12px 16px}.board{grid-template-columns:repeat(6,minmax(208px,86vw))}h1{font-size:17px}.toolbar select{flex:1 1 45%}.mark{width:32px;height:32px}}
/*__BRAND__*/
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">__KITMARK__<div class="titles"><div class="cap"><b>__KIT_NAME__</b><span class="sep"></span><span>Project kanban</span></div>
      <h1>__LOGO__<span class="pname">__PROJECT__</span></h1><div class="sub mono" id="gen"></div></div></div>
    <div class="overall"><div class="big num" id="opct"></div><div class="rest"><div class="bar big" id="obar"></div><div class="stats" id="ostats"></div></div></div>
    <button class="btn" id="theme" title="Toggle light/dark">◐ Theme</button>
  </header>
  <section class="phases" id="phases" aria-label="Phases"></section>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search id, title, requirement, module…" aria-label="Search">
    <select id="fkind" aria-label="Kind"><option value="">Tasks + bugs</option><option value="task">Tasks</option><option value="bug">Bugs & gaps</option></select>
    <select id="ftype" aria-label="Type"><option value="">All types</option></select>
    <select id="fprio" aria-label="Priority"><option value="">All priorities</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select>
    <select id="fowner" aria-label="Owner"><option value="">Anyone</option><option value="user">You (USER)</option><option value="agent">Agent</option></select>
    <label><input type="checkbox" id="hidedone"> Hide done</label>
  </div>
  <section id="phasehead"></section>
  <section class="board" id="board" aria-label="Kanban board"></section>
  <section class="panels" id="panels"></section>
  <footer>__CREDIT__<span>Generated by <code>./kanban build</code> from <code>tracking/</code>. Source of truth: the item files. Don't edit this page.</span></footer>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true"><div class="scrim" data-close></div><div class="sheet" id="sheet"></div></div>
<script>
const DATA = /*__DATA__*/null;
const COLS=[["backlog","Backlog"],["ready","Ready"],["in_progress","In progress"],["review","Review"],["blocked","Blocked"],["done","Done"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state={p:"all",q:"",kind:"",type:"",prio:"",owner:"",hidedone:false};
function readHash(){const h=new URLSearchParams(location.hash.slice(1));for(const k of Object.keys(state)){if(h.has(k))state[k]=k==="hidedone"?h.get(k)==="1":h.get(k)}}
function writeHash(){const h=new URLSearchParams();for(const[k,v]of Object.entries(state)){if(v&&v!=="all")h.set(k,v===true?"1":v)}history.replaceState(null,"","#"+h.toString())}
function bar(p){return `<i class="d" style="width:${p.done}%"></i><i class="r" style="width:${p.review}%"></i><i class="p" style="width:${p.inprog}%"></i>`}
function header(){
  $("#gen").textContent="Updated "+DATA.generated;
  $("#opct").textContent=DATA.overall.pct.toFixed(0)+"%";
  $("#obar").innerHTML=bar(DATA.overall);
  const it=DATA.items.filter(i=>i.kind==="task"||i.kind==="chore");
  const c=s=>it.filter(i=>i.status===s).length;
  const bugs=DATA.items.filter(i=>(i.kind==="bug"||i.kind==="gap")&&!["done","cancelled"].includes(i.status));
  $("#ostats").innerHTML=[`<span class="chip"><b>${it.length}</b> tasks</span>`,`<span class="chip"><b>${c("done")}</b> done</span>`,
    `<span class="chip"><b>${c("in_progress")}</b> in progress</span>`,`<span class="chip"><b>${c("ready")}</b> ready</span>`,
    `<span class="chip"><b>${c("blocked")}</b> blocked</span>`,`<span class="chip"><b>${bugs.length}</b> open bugs/gaps</span>`,
    `<span class="chip"><b>${DATA.docsync.length}</b> doc sync</span>`].join("");
}
function phases(){
  const all={n:"all",title:"Every phase, rolled up",status:"",progress:DATA.overall,counts:null};
  const cards=[all,...DATA.phases].map(p=>{
    const tasks=p.counts?Object.entries(p.counts).filter(([k])=>k!=="cancelled").reduce((a,[,v])=>a+v,0):DATA.items.filter(i=>i.kind==="task").length;
    const done=p.counts?p.counts.done:DATA.items.filter(i=>i.kind==="task"&&i.status==="done").length;
    const bugs=p.bugs?(p.bugs.S1+p.bugs.S2+p.bugs.S3+p.bugs.S4+(p.bugs[""]||0)):DATA.items.filter(i=>(i.kind==="bug"||i.kind==="gap")&&!["done","cancelled"].includes(i.status)).length;
    return `<button class="pcard ${String(state.p)===String(p.n)?"on":""}" data-p="${p.n}">
      <div class="t"><span class="n cap">${p.n==="all"?"All phases":"Phase "+p.n}</span><span class="pct num">${p.progress.pct.toFixed(0)}%</span></div>
      <div class="nm">${esc(p.title)}</div><div class="bar">${bar(p.progress)}</div>
      <div class="meta"><span>${done}/${tasks} done${bugs?` · ${bugs} bugs`:""}</span>${p.status?`<span class="st ${p.open===false&&p.status!=="done"?"locked":p.status}">${p.open===false&&p.status!=="done"?"locked":p.status.replace("_"," ")}</span>`:""}</div></button>`}).join("");
  $("#phases").innerHTML=cards;
}
function match(i){
  if(state.p!=="all"&&String(i.phase)!==String(state.p))return false;
  if(state.kind==="task"&&!(i.kind==="task"||i.kind==="chore"))return false;
  if(state.kind==="bug"&&!(i.kind==="bug"||i.kind==="gap"))return false;
  if(state.type&&i.type!==state.type)return false;
  if(state.prio&&i.priority!==state.prio)return false;
  if(state.owner&&i.owner!==state.owner)return false;
  if(state.hidedone&&(i.status==="done"||i.status==="cancelled"))return false;
  if(state.q){const q=state.q.toLowerCase();const hay=[i.id,i.title,i.type,i.status,...(i.requirements||[]),...(i.roadmap_todos||[]),...(i.modules||[]),...(i.dashboards||[])].join(" ").toLowerCase();if(!hay.includes(q))return false}
  return true;
}
function card(i){
  const isBug=i.kind==="bug"||i.kind==="gap";
  const pct=i.todo[1]?Math.round(100*i.todo[0]/i.todo[1]):0;
  return `<button class="card ${i.priority} ${isBug?"bug":""}" data-id="${i.id}">
    <div class="id">${i.id}${state.p==="all"?"":""} · ${i.size}${i.owner==="user"?" · you":""}</div>
    <div class="ttl">${esc(i.title)}</div>
    <div class="bd"><span class="b ${i.type}">${i.type}</span>${isBug?`<span class="b ${i.severity}">${i.kind} ${i.severity}</span>`:""}${i.priority==="critical"||i.priority==="high"?`<span class="b ${i.priority}">${i.priority}</span>`:""}${(i.requirements||[]).slice(0,2).map(r=>`<span class="b">${r}</span>`).join("")}</div>
    ${["in_progress","review"].includes(i.status)?`<div class="mini"><i style="width:${pct}%"></i></div><div class="note">${i.todo[0]}/${i.todo[1]} · ${esc(i.checkpoint||"no checkpoint")}</div>`:""}
    ${i.status==="blocked"?`<div class="warn">⛔ ${esc(i.blocked_reason)}</div>`:""}
    ${i.waiting&&i.waiting.length&&i.status!=="done"?`<div class="note">waits on ${i.waiting.slice(0,3).join(", ")}${i.waiting.length>3?"…":""}</div>`:""}
    ${i.stale?`<div class="warn">⚠ stale (no update > 7 days)</div>`:""}
    ${i.doc_sync_status==="pending"?`<div class="warn">📄 doc sync pending</div>`:""}
  </button>`;
}
function board(){
  const items=DATA.items.filter(match);
  $("#board").innerHTML=COLS.filter(([k])=>!(state.hidedone&&k==="done")).map(([k,t])=>{
    const PR={critical:0,high:1,medium:2,low:3};const rows=items.filter(i=>i.status===k).sort((x,y)=>(PR[x.priority]-PR[y.priority])||(x.phase-y.phase)||x.id.localeCompare(y.id));
    return `<div class="col ${k}"><h3><span class="cap">${t}</span><span class="c num">${rows.length}</span></h3><div class="list">${rows.map(card).join("")||`<div class="empty">—</div>`}</div></div>`}).join("");
}
function phaseHead(){
  if(state.p==="all"){$("#phasehead").innerHTML="";return}
  const p=DATA.phases.find(x=>String(x.n)===String(state.p));
  $("#phasehead").innerHTML=`<div class="phasehead"><div><h2>Phase ${p.n} · ${esc(p.title)}</h2>
    <div class="stats"><span class="st ${p.status}">${p.status.replace("_"," ")}</span><span class="chip">${p.open?"open":"locked until prerequisites are done"}</span>
    <span class="chip">exit criteria <b>${p.exit[0]}/${p.exit[1]}</b></span><span class="chip">bugs S1 <b>${p.bugs.S1}</b> · S2 <b>${p.bugs.S2}</b> · S3 <b>${p.bugs.S3}</b></span>
    <a class="chip" href="${p.roadmap}">roadmap</a><a class="chip" href="${p.board}">BOARD.md</a><a class="chip" href="tracking/phase-${p.n}/PHASE.md">PHASE.md</a></div></div>
    <div style="flex:1 1 280px;max-width:460px"><div class="bar big">${bar(p.progress)}</div><div class="stats"><span class="chip"><b>${p.progress.pct.toFixed(0)}%</b></span><span class="chip"><i class="dot d"></i>done ${p.progress.done.toFixed(0)}%</span><span class="chip"><i class="dot r"></i>review ${p.progress.review.toFixed(0)}%</span><span class="chip"><i class="dot p"></i>in progress ${p.progress.inprog.toFixed(0)}%</span></div></div></div>`;
}
function panels(){
  const out=[];
  if(state.p!=="all"){const p=DATA.phases.find(x=>String(x.n)===String(state.p));
    out.push(`<details class="panel"><summary>Phase plan (PHASE.md): exit criteria, workstreams, traceability</summary><div class="md">${md(p.body,"tracking/phase-"+p.n+"/PHASE.md")}</div></details>`)}
  const inprog=DATA.items.filter(i=>i.status==="in_progress"&&(state.p==="all"||String(i.phase)===String(state.p)));
  out.push(`<div class="panel"><h3 class="cap">Resume here · in progress</h3>${inprog.length?`<ul>${inprog.map(i=>`<li><a href="#" data-id="${i.id}">${i.id}</a> ${esc(i.title)}: <i>${esc(i.checkpoint||"no checkpoint")}</i><br><span class="note">${esc(i.last||"")}</span></li>`).join("")}</ul>`:`<div class="empty">Nothing in progress.</div>`}</div>`);
  out.push(`<div class="panel"><h3 class="cap">Doc sync pending</h3>${DATA.docsync.length?`<ul>${DATA.docsync.map(d=>`<li>${md(d,"").replace(/^<p>|<\/p>$/g,"")}</li>`).join("")}</ul>`:`<div class="empty">Nothing pending.</div>`}</div>`);
  if(DATA.sessions.length)out.push(`<div class="panel"><h3 class="cap">Recent sessions · cloud ↔ local</h3><ul>${DATA.sessions.slice(-8).reverse().map(s=>`<li class="note">${esc(s.slice(2))}</li>`).join("")}</ul></div>`);
  $("#panels").innerHTML=out.join("");
}
function resolve(base,href){
  if(/^(https?:|mailto:|#)/.test(href))return href;
  const parts=base.split("/");parts.pop();
  for(const seg of href.split("/")){if(seg==="..")parts.pop();else if(seg!==".")parts.push(seg)}
  return parts.join("/");
}
function inline(s,base){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,h)=>`<a href="${esc(resolve(base,h.replace(/&amp;/g,"&")))}">${t}</a>`);
}
function md(src,base){
  const L=String(src||"").split("\n");let h="",i=0,list=null;
  const close=()=>{if(list){h+=`</${list}>`;list=null}};
  while(i<L.length){let l=L[i];
    if(/^```/.test(l)){close();let b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);h+=`<pre><code>${esc(b.join("\n"))}</code></pre>`;i++;continue}
    if(/^\s*\|/.test(l)){close();let rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);
      rows=rows.filter(r=>!/^\s*\|[\s\-:|]+\|\s*$/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,"").split(/(?<!\\)\|/).map(c=>inline(c.trim().replace(/\\\|/g,"|"),base)));
      h+=`<table>${rows.map((r,k)=>`<tr>${r.map(c=>k?`<td>${c}</td>`:`<th>${c}</th>`).join("")}</tr>`).join("")}</table>`;continue}
    let m;
    if(m=l.match(/^(#{1,4})\s+(.*)/)){close();h+=`<h${m[1].length}>${inline(m[2],base)}</h${m[1].length}>`}
    else if(m=l.match(/^\s*- \[([ xX])\]\s+(.*)/)){if(list!=="ul"){close();h+="<ul>";list="ul"}h+=`<li class="cb">${m[1]===" "?"☐":"☑"} ${inline(m[2],base)}</li>`}
    else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=="ul"){close();h+="<ul>";list="ul"}h+=`<li>${inline(m[1],base)}</li>`}
    else if(m=l.match(/^\s*\d+\.\s+(.*)/)){if(list!=="ol"){close();h+="<ol>";list="ol"}h+=`<li>${inline(m[1],base)}</li>`}
    else if(!l.trim()){close()}
    else if(/^>/.test(l)){close();h+=`<p class="note">${inline(l.replace(/^>\s?/,""),base)}</p>`}
    else{close();h+=`<p>${inline(l,base)}</p>`}
    i++}
  close();return h;
}
function openItem(id){
  const i=DATA.items.find(x=>x.id===id);if(!i)return;
  const kv=[["Status",i.status],["Type",i.type],["Kind",i.kind+(i.severity?" · "+i.severity:"")],["Priority",i.priority],["Size",i.size],["Owner",i.owner+(i.claimed_by?" · "+i.claimed_by:"")],
    ["Depends on",(i.depends_on||[]).join(", ")||"—"],["Waiting on",(i.waiting||[]).join(", ")||"—"],["Requirements",(i.requirements||[]).join(", ")||"—"],["Roadmap ToDos",(i.roadmap_todos||[]).join(", ")||"—"],
    ["Modules / dashboards",[...(i.modules||[]),...(i.dashboards||[])].join(", ")||"—"],["Branch",i.branch||"—"],["PR",i.pr||"—"],["Doc sync",(i.doc_sync||[]).join(", ")+(i.doc_sync?.length?" · "+i.doc_sync_status:"—")],
    ["Dates",`created ${i.created}${i.started?" · started "+i.started:""}${i.completed?" · completed "+i.completed:""} · updated ${i.updated}`],["Checkpoint",i.checkpoint||"—"],["Needs",i.requires?Object.entries(i.requires).filter(([,v])=>v.length).map(([k,v])=>k+": "+v.join(", ")).join(" · ")||"—":"—"],["Review",i.review_result||"—"],["File",`<a href="${i.path}">${i.path}</a>`]];
  $("#sheet").innerHTML=`<div class="top"><div><div class="id mono">${i.id}</div><h2>${esc(i.title)}</h2></div><button class="btn" data-close>✕ Close</button></div>
    <dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${k==="File"?v:esc(v)}</dd>`).join("")}</dl><div class="md">${md(i.body,i.path)}</div>`;
  $("#drawer").classList.add("on");$("#sheet").scrollTop=0;
}
function render(){header();phases();phaseHead();board();panels();writeHash()}
document.addEventListener("click",e=>{
  const pc=e.target.closest(".pcard");if(pc){state.p=pc.dataset.p;render();return}
  const c=e.target.closest("[data-id]");if(c){e.preventDefault();openItem(c.dataset.id);return}
  if(e.target.closest("[data-close]"))$("#drawer").classList.remove("on");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#drawer").classList.remove("on")});
[["#q","q","input"],["#fkind","kind","change"],["#ftype","type","change"],["#fprio","prio","change"],["#fowner","owner","change"]].forEach(([s,k,ev])=>$(s).addEventListener(ev,e=>{state[k]=e.target.value;render()}));
$("#hidedone").addEventListener("change",e=>{state.hidedone=e.target.checked;render()});
$("#theme").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("cnpm-theme",r.dataset.theme)}catch(_){}});
try{const t=localStorage.getItem("cnpm-theme");if(t)document.documentElement.dataset.theme=t}catch(_){}
[...new Set(DATA.items.map(i=>i.type))].sort().forEach(t=>{const o=document.createElement("option");o.textContent=t;$("#ftype").appendChild(o)});
readHash();["q","kind","type","prio","owner"].forEach(k=>{const el=$({q:"#q",kind:"#fkind",type:"#ftype",prio:"#fprio",owner:"#fowner"}[k]);if(el)el.value=state[k]});$("#hidedone").checked=state.hidedone;
render();
</script>
</body>
</html>
