<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MasterTrader Kanban</title>
<meta name="description" content="Unified project kanban for MasterTrader: per-phase boards, progress bars, bugs and doc-sync queue. Generated by ./kanban build.">
<style>
:root{
  --bg:#F5F7FA;--panel:#FFFFFF;--panel2:#EEF2F6;--line:#D9E0E8;--text:#0B1220;--muted:#5B6878;
  --mint:#0FA97A;--cobalt:#2F66E0;--flare:#E2553A;--amber:#B7791F;--violet:#7A5AF8;
  --done:var(--mint);--review:var(--cobalt);--prog:var(--amber);--shadow:0 1px 2px rgba(10,20,30,.06),0 4px 14px rgba(10,20,30,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07090D;--panel:#0E131A;--panel2:#151C25;--line:#222C38;--text:#E6EDF3;--muted:#8B98A5;
  --mint:#2BE4A7;--cobalt:#3A7BFF;--flare:#FF6B4A;--amber:#F5B841;--violet:#A48BFF;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#07090D;--panel:#0E131A;--panel2:#151C25;--line:#222C38;--text:#E6EDF3;--muted:#8B98A5;
  --mint:#2BE4A7;--cobalt:#3A7BFF;--flare:#FF6B4A;--amber:#F5B841;--violet:#A48BFF;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
a{color:var(--cobalt);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.wrap{max-width:1680px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--mint),var(--cobalt));display:grid;place-items:center;color:#07090D;font-weight:800}
h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12px}
.overall{flex:1 1 320px;min-width:0}
.bar{display:flex;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}.bar .d{background:var(--done)}.bar .r{background:var(--review)}.bar .p{background:var(--prog)}
.bar.big{height:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px}.dot.d{background:var(--done)}.dot.r{background:var(--review)}.dot.p{background:var(--prog)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--text)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--cobalt)}
.phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin-bottom:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);text-align:left;color:inherit;font:inherit}
.pcard:hover{border-color:var(--cobalt)}.pcard.on{outline:2px solid var(--mint);border-color:transparent}
.pcard .t{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.pcard .n{font-weight:700}.pcard .nm{font-size:12px;color:var(--muted);min-height:2.6em;margin:2px 0 8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .pct{font-weight:700;font-variant-numeric:tabular-nums}
.pcard .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.st{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.st.in_progress{color:var(--amber);border-color:currentColor}.st.done{color:var(--mint);border-color:currentColor}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:160px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
.toolbar select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;font:inherit}
.toolbar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.phasehead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.phasehead h2{margin:0;font-size:16px}
.phasehead .bar{width:min(420px,100%)}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:10px;align-items:start}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:80px;display:flex;flex-direction:column;max-height:78vh}
.col h3{margin:0;padding:9px 11px;font-size:13px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel2);border-radius:12px 12px 0 0}
.col h3 .c{color:var(--muted);font-weight:600}
.col .list{padding:8px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:9px;padding:8px 9px;cursor:pointer;box-shadow:var(--shadow);text-align:left;color:inherit;font:inherit;width:100%}
.card:hover{border-color:var(--cobalt)}
.card .id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted)}
.card .ttl{margin:2px 0 6px;font-weight:600;font-size:13px}
.card .bd{display:flex;flex-wrap:wrap;gap:4px}
.b{font-size:10.5px;padding:0 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);line-height:17px}
.b.USER{color:var(--violet);border-color:currentColor}.b.BUILD{color:var(--cobalt);border-color:currentColor}.b.OPS{color:var(--amber);border-color:currentColor}
.b.VERIFY{color:var(--mint);border-color:currentColor}.b.RUN{color:var(--text)}.b.DOC{color:var(--muted)}
.b.critical,.b.S1{background:var(--flare);color:#fff;border-color:var(--flare)}.b.high,.b.S2{color:var(--flare);border-color:currentColor}
.card.critical{border-left-color:var(--flare)}.card.high{border-left-color:var(--amber)}.card.bug{border-left-color:var(--flare);border-left-style:dashed}
.mini{height:4px;border-radius:99px;background:var(--panel2);margin-top:7px;overflow:hidden}.mini i{display:block;height:100%;background:var(--prog)}
.warn{color:var(--flare);font-size:11.5px;margin-top:4px}
.note{color:var(--muted);font-size:11.5px;margin-top:4px}
.empty{color:var(--muted);font-size:12px;padding:6px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:10px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;overflow-wrap:anywhere}
.panel h3{margin:0 0 8px;font-size:14px}
.panel ul{margin:0;padding-left:18px}.panel li{margin:3px 0}
details.panel summary{cursor:pointer;font-weight:600}
.drawer{position:fixed;inset:0;display:none;z-index:20}
.drawer.on{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.drawer .sheet{position:absolute;top:0;right:0;height:100%;width:min(760px,100%);background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 18px}
.sheet .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;position:sticky;top:-16px;background:var(--panel);padding:6px 0 10px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:12.5px;margin:12px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.md h1{font-size:17px}.md h2{font-size:15px;margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}.md h3{font-size:13.5px;margin:12px 0 4px}
.md ul,.md ol{padding-left:20px}.md li{margin:2px 0}
.md table{border-collapse:collapse;width:100%;font-size:12.5px;display:block;overflow:auto}.md td,.md th{border:1px solid var(--line);padding:4px 6px;text-align:left}
.md pre{background:var(--panel2);padding:10px;border-radius:8px;overflow:auto}
.md .cb{list-style:none;margin-left:-18px}
footer{color:var(--muted);font-size:12px;margin:18px 0 6px;text-align:center}
@media (max-width:1100px){.board{grid-template-columns:repeat(6,minmax(240px,82vw));overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.col{scroll-snap-align:start}}
@media (max-width:640px){.phases{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.pcard{flex:0 0 min(168px,70vw);scroll-snap-align:start}.pcard .nm{min-height:0}.overall{flex-basis:100%}}
@media (max-width:480px){.wrap{padding:12px 16px}.board{grid-template-columns:repeat(6,minmax(200px,86vw))}h1{font-size:16px}.toolbar select{flex:1 1 45%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">M</div><div><h1>MasterTrader · Project Kanban</h1><div class="sub" id="gen"></div></div></div>
    <div class="overall"><div class="bar big" id="obar"></div><div class="stats" id="ostats"></div></div>
    <button class="btn" id="theme" title="Toggle theme">◐ Theme</button>
  </header>
  <section class="phases" id="phases" aria-label="Phases"></section>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search id, title, requirement, module…" aria-label="Search">
    <select id="fkind" aria-label="Kind"><option value="">Tasks + bugs</option><option value="task">Tasks</option><option value="bug">Bugs & gaps</option></select>
    <select id="ftype" aria-label="Type"><option value="">All types</option><option>USER</option><option>BUILD</option><option>OPS</option><option>VERIFY</option><option>RUN</option><option>DOC</option></select>
    <select id="fprio" aria-label="Priority"><option value="">All priorities</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select>
    <select id="fowner" aria-label="Owner"><option value="">Anyone</option><option value="user">You (USER)</option><option value="agent">Agent</option></select>
    <label><input type="checkbox" id="hidedone"> Hide done</label>
  </div>
  <section id="phasehead"></section>
  <section class="board" id="board" aria-label="Kanban board"></section>
  <section class="panels" id="panels"></section>
  <footer>Generated by <code>./kanban build</code> from <code>tracking/</code>. Source of truth: the item files. Don't edit this page.</footer>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true"><div class="scrim" data-close></div><div class="sheet" id="sheet"></div></div>
<script>
const DATA = /*__DATA__*/null;
const COLS=[["backlog","Backlog"],["ready","Ready"],["in_progress","In progress"],["review","Review"],["blocked","Blocked"],["done","Done"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state={p:"all",q:"",kind:"",type:"",prio:"",owner:"",hidedone:false};
function readHash(){const h=new URLSearchParams(location.hash.slice(1));for(const k of Object.keys(state)){if(h.has(k))state[k]=k==="hidedone"?h.get(k)==="1":h.get(k)}}
function writeHash(){const h=new URLSearchParams();for(const[k,v]of Object.entries(state)){if(v&&v!=="all")h.set(k,v===true?"1":v)}history.replaceState(null,"","#"+h.toString())}
function bar(p){return `<i class="d" style="width:${p.done}%"></i><i class="r" style="width:${p.review}%"></i><i class="p" style="width:${p.inprog}%"></i>`}
function header(){
  $("#gen").textContent="Updated "+DATA.generated;
  $("#obar").innerHTML=bar(DATA.overall);
  const it=DATA.items.filter(i=>i.kind==="task"||i.kind==="chore");
  const c=s=>it.filter(i=>i.status===s).length;
  const bugs=DATA.items.filter(i=>(i.kind==="bug"||i.kind==="gap")&&!["done","cancelled"].includes(i.status));
  $("#ostats").innerHTML=[`<span class="chip"><b>${DATA.overall.pct.toFixed(0)}%</b> overall</span>`,
    `<span class="chip"><b>${it.length}</b> tasks</span>`,`<span class="chip"><b>${c("done")}</b> done</span>`,
    `<span class="chip"><b>${c("in_progress")}</b> in progress</span>`,`<span class="chip"><b>${c("ready")}</b> ready</span>`,
    `<span class="chip"><b>${c("blocked")}</b> blocked</span>`,`<span class="chip"><b>${bugs.length}</b> open bugs/gaps</span>`,
    `<span class="chip"><b>${DATA.docsync.length}</b> doc sync</span>`].join("");
}
function phases(){
  const all={n:"all",title:"All phases",status:"",progress:DATA.overall,counts:null};
  const cards=[all,...DATA.phases].map(p=>{
    const tasks=p.counts?Object.entries(p.counts).filter(([k])=>k!=="cancelled").reduce((a,[,v])=>a+v,0):DATA.items.filter(i=>i.kind==="task").length;
    const done=p.counts?p.counts.done:DATA.items.filter(i=>i.kind==="task"&&i.status==="done").length;
    const bugs=p.bugs?(p.bugs.S1+p.bugs.S2+p.bugs.S3+p.bugs.S4+(p.bugs[""]||0)):DATA.items.filter(i=>(i.kind==="bug"||i.kind==="gap")&&!["done","cancelled"].includes(i.status)).length;
    return `<button class="pcard ${String(state.p)===String(p.n)?"on":""}" data-p="${p.n}">
      <div class="t"><span class="n">${p.n==="all"?"All":"P"+p.n}</span><span class="pct">${p.progress.pct.toFixed(0)}%</span></div>
      <div class="nm">${esc(p.title)}</div><div class="bar">${bar(p.progress)}</div>
      <div class="meta"><span>${done}/${tasks} done${bugs?` · ${bugs} bugs`:""}</span>${p.status?`<span class="st ${p.status}">${p.status.replace("_"," ")}${p.open===false&&p.status!=="done"?" · locked":""}</span>`:""}</div></button>`}).join("");
  $("#phases").innerHTML=cards;
}
function match(i){
  if(state.p!=="all"&&String(i.phase)!==String(state.p))return false;
  if(state.kind==="task"&&!(i.kind==="task"||i.kind==="chore"))return false;
  if(state.kind==="bug"&&!(i.kind==="bug"||i.kind==="gap"))return false;
  if(state.type&&i.type!==state.type)return false;
  if(state.prio&&i.priority!==state.prio)return false;
  if(state.owner&&i.owner!==state.owner)return false;
  if(state.hidedone&&(i.status==="done"||i.status==="cancelled"))return false;
  if(state.q){const q=state.q.toLowerCase();const hay=[i.id,i.title,i.type,i.status,...(i.requirements||[]),...(i.roadmap_todos||[]),...(i.modules||[]),...(i.dashboards||[])].join(" ").toLowerCase();if(!hay.includes(q))return false}
  return true;
}
function card(i){
  const isBug=i.kind==="bug"||i.kind==="gap";
  const pct=i.todo[1]?Math.round(100*i.todo[0]/i.todo[1]):0;
  return `<button class="card ${i.priority} ${isBug?"bug":""}" data-id="${i.id}">
    <div class="id">${i.id}${state.p==="all"?"":""} · ${i.size}${i.owner==="user"?" · you":""}</div>
    <div class="ttl">${esc(i.title)}</div>
    <div class="bd"><span class="b ${i.type}">${i.type}</span>${isBug?`<span class="b ${i.severity}">${i.kind} ${i.severity}</span>`:""}${i.priority==="critical"||i.priority==="high"?`<span class="b ${i.priority}">${i.priority}</span>`:""}${(i.requirements||[]).slice(0,2).map(r=>`<span class="b">${r}</span>`).join("")}</div>
    ${["in_progress","review"].includes(i.status)?`<div class="mini"><i style="width:${pct}%"></i></div><div class="note">${i.todo[0]}/${i.todo[1]} · ${esc(i.checkpoint||"no checkpoint")}</div>`:""}
    ${i.status==="blocked"?`<div class="warn">⛔ ${esc(i.blocked_reason)}</div>`:""}
    ${i.waiting&&i.waiting.length&&i.status!=="done"?`<div class="note">waits on ${i.waiting.slice(0,3).join(", ")}${i.waiting.length>3?"…":""}</div>`:""}
    ${i.stale?`<div class="warn">⚠ stale (no update > 7 days)</div>`:""}
    ${i.doc_sync_status==="pending"?`<div class="warn">📄 doc sync pending</div>`:""}
  </button>`;
}
function board(){
  const items=DATA.items.filter(match);
  $("#board").innerHTML=COLS.filter(([k])=>!(state.hidedone&&k==="done")).map(([k,t])=>{
    const rows=items.filter(i=>i.status===k);
    return `<div class="col"><h3><span>${t}</span><span class="c">${rows.length}</span></h3><div class="list">${rows.map(card).join("")||`<div class="empty">—</div>`}</div></div>`}).join("");
}
function phaseHead(){
  if(state.p==="all"){$("#phasehead").innerHTML="";return}
  const p=DATA.phases.find(x=>String(x.n)===String(state.p));
  $("#phasehead").innerHTML=`<div class="phasehead"><div><h2>Phase ${p.n} · ${esc(p.title)}</h2>
    <div class="stats"><span class="st ${p.status}">${p.status.replace("_"," ")}</span><span class="chip">${p.open?"open":"locked until prerequisites are done"}</span>
    <span class="chip">exit criteria <b>${p.exit[0]}/${p.exit[1]}</b></span><span class="chip">bugs S1 <b>${p.bugs.S1}</b> · S2 <b>${p.bugs.S2}</b> · S3 <b>${p.bugs.S3}</b></span>
    <a class="chip" href="${p.roadmap}">roadmap</a><a class="chip" href="${p.board}">BOARD.md</a><a class="chip" href="tracking/phase-${p.n}/PHASE.md">PHASE.md</a></div></div>
    <div style="flex:1 1 280px;max-width:460px"><div class="bar big">${bar(p.progress)}</div><div class="stats"><span class="chip"><b>${p.progress.pct.toFixed(0)}%</b></span><span class="chip"><i class="dot d"></i>done ${p.progress.done.toFixed(0)}%</span><span class="chip"><i class="dot r"></i>review ${p.progress.review.toFixed(0)}%</span><span class="chip"><i class="dot p"></i>in progress ${p.progress.inprog.toFixed(0)}%</span></div></div></div>`;
}
function panels(){
  const out=[];
  if(state.p!=="all"){const p=DATA.phases.find(x=>String(x.n)===String(state.p));
    out.push(`<details class="panel"><summary>Phase plan (PHASE.md): exit criteria, workstreams, traceability</summary><div class="md">${md(p.body,"tracking/phase-"+p.n+"/PHASE.md")}</div></details>`)}
  const inprog=DATA.items.filter(i=>i.status==="in_progress"&&(state.p==="all"||String(i.phase)===String(state.p)));
  out.push(`<div class="panel"><h3>Resume here (in progress)</h3>${inprog.length?`<ul>${inprog.map(i=>`<li><a href="#" data-id="${i.id}">${i.id}</a> ${esc(i.title)}: <i>${esc(i.checkpoint||"no checkpoint")}</i><br><span class="note">${esc(i.last||"")}</span></li>`).join("")}</ul>`:`<div class="empty">Nothing in progress.</div>`}</div>`);
  out.push(`<div class="panel"><h3>Doc sync pending</h3>${DATA.docsync.length?`<ul>${DATA.docsync.map(d=>`<li>${md(d,"").replace(/^<p>|<\/p>$/g,"")}</li>`).join("")}</ul>`:`<div class="empty">Nothing pending.</div>`}</div>`);
  if(DATA.sessions.length)out.push(`<div class="panel"><h3>Recent sessions (cloud ↔ local)</h3><ul>${DATA.sessions.slice(-8).reverse().map(s=>`<li class="note">${esc(s.slice(2))}</li>`).join("")}</ul></div>`);
  $("#panels").innerHTML=out.join("");
}
function resolve(base,href){
  if(/^(https?:|mailto:|#)/.test(href))return href;
  const parts=base.split("/");parts.pop();
  for(const seg of href.split("/")){if(seg==="..")parts.pop();else if(seg!==".")parts.push(seg)}
  return parts.join("/");
}
function inline(s,base){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,h)=>`<a href="${esc(resolve(base,h.replace(/&amp;/g,"&")))}">${t}</a>`);
}
function md(src,base){
  const L=String(src||"").split("\n");let h="",i=0,list=null;
  const close=()=>{if(list){h+=`</${list}>`;list=null}};
  while(i<L.length){let l=L[i];
    if(/^```/.test(l)){close();let b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);h+=`<pre><code>${esc(b.join("\n"))}</code></pre>`;i++;continue}
    if(/^\s*\|/.test(l)){close();let rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);
      rows=rows.filter(r=>!/^\s*\|[\s\-:|]+\|\s*$/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,"").split(/(?<!\\)\|/).map(c=>inline(c.trim().replace(/\\\|/g,"|"),base)));
      h+=`<table>${rows.map((r,k)=>`<tr>${r.map(c=>k?`<td>${c}</td>`:`<th>${c}</th>`).join("")}</tr>`).join("")}</table>`;continue}
    let m;
    if(m=l.match(/^(#{1,4})\s+(.*)/)){close();h+=`<h${m[1].length}>${inline(m[2],base)}</h${m[1].length}>`}
    else if(m=l.match(/^\s*- \[([ xX])\]\s+(.*)/)){if(list!=="ul"){close();h+="<ul>";list="ul"}h+=`<li class="cb">${m[1]===" "?"☐":"☑"} ${inline(m[2],base)}</li>`}
    else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=="ul"){close();h+="<ul>";list="ul"}h+=`<li>${inline(m[1],base)}</li>`}
    else if(m=l.match(/^\s*\d+\.\s+(.*)/)){if(list!=="ol"){close();h+="<ol>";list="ol"}h+=`<li>${inline(m[1],base)}</li>`}
    else if(!l.trim()){close()}
    else if(/^>/.test(l)){close();h+=`<p class="note">${inline(l.replace(/^>\s?/,""),base)}</p>`}
    else{close();h+=`<p>${inline(l,base)}</p>`}
    i++}
  close();return h;
}
function openItem(id){
  const i=DATA.items.find(x=>x.id===id);if(!i)return;
  const kv=[["Status",i.status],["Type",i.type],["Kind",i.kind+(i.severity?" · "+i.severity:"")],["Priority",i.priority],["Size",i.size],["Owner",i.owner+(i.claimed_by?" · "+i.claimed_by:"")],
    ["Depends on",(i.depends_on||[]).join(", ")||"—"],["Waiting on",(i.waiting||[]).join(", ")||"—"],["Requirements",(i.requirements||[]).join(", ")||"—"],["Roadmap ToDos",(i.roadmap_todos||[]).join(", ")||"—"],
    ["Modules / dashboards",[...(i.modules||[]),...(i.dashboards||[])].join(", ")||"—"],["Branch",i.branch||"—"],["PR",i.pr||"—"],["Doc sync",(i.doc_sync||[]).join(", ")+(i.doc_sync?.length?" · "+i.doc_sync_status:"—")],
    ["Dates",`created ${i.created}${i.started?" · started "+i.started:""}${i.completed?" · completed "+i.completed:""} · updated ${i.updated}`],["Checkpoint",i.checkpoint||"—"],["File",`<a href="${i.path}">${i.path}</a>`]];
  $("#sheet").innerHTML=`<div class="top"><div><div class="id mono">${i.id}</div><h2 style="margin:2px 0 0;font-size:17px">${esc(i.title)}</h2></div><button class="btn" data-close>✕ Close</button></div>
    <dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${k==="File"?v:esc(v)}</dd>`).join("")}</dl><div class="md">${md(i.body,i.path)}</div>`;
  $("#drawer").classList.add("on");$("#sheet").scrollTop=0;
}
function render(){header();phases();phaseHead();board();panels();writeHash()}
document.addEventListener("click",e=>{
  const pc=e.target.closest(".pcard");if(pc){state.p=pc.dataset.p;render();return}
  const c=e.target.closest("[data-id]");if(c){e.preventDefault();openItem(c.dataset.id);return}
  if(e.target.closest("[data-close]"))$("#drawer").classList.remove("on");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#drawer").classList.remove("on")});
[["#q","q","input"],["#fkind","kind","change"],["#ftype","type","change"],["#fprio","prio","change"],["#fowner","owner","change"]].forEach(([s,k,ev])=>$(s).addEventListener(ev,e=>{state[k]=e.target.value;render()}));
$("#hidedone").addEventListener("change",e=>{state.hidedone=e.target.checked;render()});
$("#theme").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("mt-kanban-theme",r.dataset.theme)}catch(_){}});
try{const t=localStorage.getItem("mt-kanban-theme");if(t)document.documentElement.dataset.theme=t}catch(_){}
readHash();["q","kind","type","prio","owner"].forEach(k=>{const el=$({q:"#q",kind:"#fkind",type:"#ftype",prio:"#fprio",owner:"#fowner"}[k]);if(el)el.value=state[k]});$("#hidedone").checked=state.hidedone;
render();
</script>
